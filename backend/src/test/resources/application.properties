# Test profile secrets — not used in production. Keeps mvn test independent of local files.
spring.profiles.active=test

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sportmanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:SportManager30}

app.jwt.secret=TestOnlyJwtSecretKeyThatIsLongEnoughForHS256Algorithm
app.jwt.expiration-ms=3600000

app.admin.default-username=admin
app.admin.default-password=admin123

app.cors.allowed-origins=http://localhost:5173
