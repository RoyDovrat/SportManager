# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# Secrets are not stored here. Provide them as environment variables on the server.
# Never deploy application-local.properties.

# Listen on localhost only. Nginx terminates HTTPS and proxies /api.
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}

# No localhost fallbacks. Missing values must fail startup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Empty first production database: default update creates tables.
# After the schema is stable, set JPA_DDL_AUTO=validate on the server.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD}

# Exact public origin(s), for example https://example.com — no trailing slash.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
