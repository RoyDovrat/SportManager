# Render + Neon. Activate with SPRING_PROFILES_ACTIVE=render
# Secrets are environment variables on Render. Never commit them.
# Do not combine this profile with prod (VPS / Nginx).

# Render routes public HTTPS to this process. PORT is injected by Render.
server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=60000

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD}
app.cron.secret=${CRON_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.jackson.time-zone=Asia/Jerusalem
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jerusalem

# Console logs only (Render captures them). No local /var/log path.
logging.level.root=INFO
logging.charset.console=UTF-8
