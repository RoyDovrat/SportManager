spring.application.name=SportManager

# Default to local secrets file (gitignored). Override with SPRING_PROFILES_ACTIVE=prod (or similar) in shared envs.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Non-secret defaults. Secrets come from env vars and/or application-local.properties (see *.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sportmanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.admin.default-username=${ADMIN_DEFAULT_USERNAME:admin}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD}

# Comma-separated browser origins (Vite default 5173; CRA/Next often 3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
