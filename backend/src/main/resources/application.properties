spring.application.name=SportManager

# Default profile is local (gitignored application-local.properties).
# Production: SPRING_PROFILES_ACTIVE=prod loads application-prod.properties and requires env secrets.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Shared non-secret defaults. Local secrets: application-local.properties.
# Production secrets: environment variables only (see application-prod.properties).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sportmanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.admin.default-username=${ADMIN_DEFAULT_USERNAME:admin}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD}

# Comma-separated browser origins (Vite default 5173; CRA/Next often 3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
