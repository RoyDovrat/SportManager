spring.application.name=SportManager

# Override locally with env vars (recommended for anything beyond local dev).
# Example: set DB_PASSWORD, JWT_SECRET, ADMIN_DEFAULT_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sportmanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:SportManager30}

# update = keep data across restarts (MVP). Use create only when you intentionally want a wipe.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT — set JWT_SECRET to a long random value before any shared/staging/production use
app.jwt.secret=${JWT_SECRET:SportManagerJwtSecretKeyThatIsLongEnoughForHS256Algorithm2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seeded on first startup if the admin user is missing
app.admin.default-username=${ADMIN_DEFAULT_USERNAME:admin}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:admin123}
