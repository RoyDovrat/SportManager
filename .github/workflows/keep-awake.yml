# Keeps the Render free API from sleeping after 15 idle minutes.
# GitHub drops most short schedules, so each run pings for hours and the next run overlaps it.
# Health does not query the database. Neon still pauses on its own after 5 quiet minutes.
#
# Repo variable: API_BASE_URL (same value as the monthly payments workflow, no trailing slash)
name: Keep API awake

on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Ping API health for several hours
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -eu
          if [ -z "${API_BASE_URL}" ]; then
            echo "Set repository variable API_BASE_URL."
            exit 1
          fi
          url="${API_BASE_URL%/}/api/health"
          # 5 hours 20 minutes. A new run is scheduled every 3 hours, so they overlap.
          deadline=$((SECONDS + 5 * 60 * 60 + 20 * 60))
          ok=0
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            echo "Ping ${url}"
            if curl -fsS --max-time 90 "${url}"; then
              echo
              ok=1
            else
              echo "Ping failed; will try again next interval."
            fi
            remaining=$((deadline - SECONDS))
            if [ "${remaining}" -le 0 ]; then
              break
            fi
            if [ "${remaining}" -gt 480 ]; then
              sleep 480
            else
              sleep "${remaining}"
            fi
          done
          if [ "${ok}" -ne 1 ]; then
            echo "Every ping failed."
            exit 1
          fi
