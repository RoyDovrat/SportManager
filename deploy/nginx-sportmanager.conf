# Copy to /etc/nginx/sites-available/sportmanager and symlink into sites-enabled.
# Replace YOUR-DOMAIN. Then: certbot --nginx -d YOUR-DOMAIN
# Frontend files: /var/www/sportmanager  (contents of frontend/dist)

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN;

    root /var/www/sportmanager;
    index index.html;

    # Vite hashed assets can be cached; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
